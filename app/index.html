  <header class="page-head">

    <div>
      <h1>先生・保護者・自治体の方へ</h1>
      <p class="lead">「わたしの学校2050」は、子どもが自分の学校の将来の児童数を題材に、データを読み、予想し、理由を考え、意見を伝えるまでを一巡する学習アプリです。</p>
    </div>

  <section class="card">
    <h2>ねらい</h2>
    <p><b>使ったあと、子どもにこうなってほしい：</b>推計を「決まった未来」ではなく「前提で変わる計算」として読み、自分の学校とまちのこれからについて、根拠のある問いを大人に投げかけられる子になる。</p>
    <p>そのために、授業の中で次のことを身につけます。</p>
    <ul>
      <li><b>データ活用の探究を、自分ごとの題材で一巡する。</b>問いを立てる、予想する、データで確かめる、理由を探る、伝える。統計的な問題解決の過程（PPDAC）に沿っています。</li>
      <li><b>推計は「前提つきの計算」だと理解する。</b>当たる・外れるではなく、前提が変われば結果も変わることを、手を動かして確かめます。</li>
      <li><b>数字のあいまいさを読む。</b>推計と実際の人数はずれます。どのくらいずれうるかを知り、数人の違いに意味を持たせないことを学びます。</li>
      <li><b>人数が減ること自体は、良い・悪いではないと知る。</b>小さい学校のよさと課題の両方を、自分の言葉で考えます。</li>
      <li><b>データを根拠に意見を表明し、返事を受け止める。</b>こども基本法は、国と自治体に、こども施策へこどもの意見を反映させる措置を求めています。学校の将来は、子ども自身が当事者となる代表的なテーマです。意見を伝えるだけで終わらせず、相手から返事が返ってくるところまでを授業に入れてください（下の「授業のあと」）。</li>
    </ul>
  </section>

  <section class="card">
    <h2>自分の学校の数字は、どのくらい信用できるか</h2>
    <ul>
      <li><b>学区データのある学校</b>：学校ごとの人数は、実際と1割前後ずれることがあります（久留米市で、ずれの中央値が約13%）。</li>
      <li><b>「おおよその区域」の学校</b>（画面に表示されます）：2〜3割、ときにそれ以上ずれます（福岡市・北九州市で中央値が約20〜24%、3割を超えてずれる学校が3〜4割）。</li>
      <li>どちらも「2050年の正確な人数」ではなく、「いまの流れが続いたら」の目安です。今年度の全校児童数を「1 ぎもん」で入れて補正し、小さな学校では数人の違いに意味を持たせないでください。くわしくは下の「読み取るときの注意」にあります。</li>
    </ul>
  </section>

  <section class="card">
    <h2>対象と準備</h2>
    <ul>
      <li>対象は小学4年生から中学3年生（主に小学5・6年生）。ふりがなを付けています。4年生は割合（%）をまだ習っていないので、「45% へる」は「だいたい半分になる」のように人数で言いかえてください。中学生は、通っていた小学校を選びます（一覧は公立の小学校だけです）。</li>
      <li>1人1台端末（Chromebook、iPad、Windows）のブラウザで動きます。ログインもインストールも不要です。</li>
      <li>タブレットかパソコンでの利用をおすすめします（線をかく画面やグラフが見やすいため）。スマートフォンでも使えます。</li>
      <li>フォルダごと配れば、インターネットにつながらない教室でも index.html を開くだけで動きます。</li>
      <li>氏名は入力させません。入力内容は端末のブラウザ内にだけ保存され、外部へ送信されません。アクセス解析も入れていません。</li>
      <li><b>準備の目安は90分ほどです。</b>自分で一度最後まで操作する。自分の学校と市内の学校の数字を見る（統合が決まった学校や小規模校がないか。下の「配慮すること」）。今年度の全校児童数と、学校の昔の児童数（学校要覧・記念誌）を用意する。コードを貼る場所を作る（「クラスで 使う」）。子どもの端末で開けるか（フィルタリング）と、ブラウザの保存が次の時間まで残るかを確かめる。</li>
      <li>対象の地域は全国47都道府県の公立小学校です。学区データの無い市区町村や、学区データに入っていない学校は、学校の位置から作った「おおよその区域」で計算しています。福島県の7町村は、このアプリでは扱っていません（下の「読み取るときの注意」）。市区町村ごとの扱いは<a href="https://github.com/h-kazuki-pixel/watashi-no-gakkou-2050/blob/main/docs/COVERAGE.md" target="_blank" rel="noopener">全国の扱いの一覧（COVERAGE.md）</a>にあります。</li>
    </ul>
  </section>

        <tr><td>5分</td><td>ふりかえり。宿題：学校の昔の児童数を調べる（学校要覧・記念誌でもよい）。</td><td>—</td></tr>

        <tr><td>8分</td><td>年齢の階段で、推計のしくみを知る。</td><td>4 なぜ？ A</td></tr>

        <tr><td>7分</td><td>クイズで、推計の意味・割合・グラフの読み方を確認する。</td><td>4 なぜ？ D</td></tr>
        <tr><td>5分</td><td>ふりかえり：データを見て、考えはどう変わったか（ワークシート）。</td><td>—</td></tr>

    <p>2コマしか取れないときは、1・2コマ目（予想して確かめ、理由を探る）を行い、提案はクラスの中で読み合うまでにしてください。届け先と返事の段取りが無いまま提案を外へ出すと、子どもは「言っても何も起きない」と学んでしまうおそれがあります。発問のヒントは<a href="https://github.com/h-kazuki-pixel/watashi-no-gakkou-2050/blob/main/docs/LESSON_PLAN.md" target="_blank" rel="noopener">授業案（LESSON_PLAN.md）</a>にあります。</p>

  <section class="card">
    <h2>授業のあと（提案を届ける・見直す）</h2>
    <ol>
      <li><b>届ける前に、管理職に相談する。</b>校外（市区町村長・教育委員会）に出すときは、学校の判断と保護者の了解を取ります。子どもが家から自分で送らないよう、届けるのは学校から、と伝えます。</li>
      <li><b>まず身近な相手に聞いてもらう。</b>校長先生か地域の方に、提案を聞いてもらう時間を作ります（宛先は、はじめは「校長先生」が選ばれています）。お願いするときに、返事をもらう日と返事の形を先に決めます。返事は短くてかまいません（「読みました」「ここは考えてみます」「ここは難しい。理由は…」）。</li>
      <li><b>返事を読む時間を取る。</b>返事を読み、提案を書き直します。「難しい」と言われたことにも理由があることを確かめます。</li>
      <li><b>時間をあけて見直す。</b>予想の数とデータの数はワークシートに残しておきます（端末の保存は消えることがあります）。次の年の5月に、実際の全校児童数と新入生の数を確かめ、予想とデータと比べます。卒業前にもう一度予想する、中学校で同じ学区を見る、のも続け方です。</li>
      <li><b>次の問いへ。</b>「クラスで 見る」の「もっと 知りたい データ」を映し、そのデータはどこに聞けば分かるかを話し合います。</li>
    </ol>
    <h3>単元にするなら（総合的な学習の時間 8時間の例）</h3>
    <div class="table-wrap">
    <table>
      <thead><tr><th>時</th><th>活動</th><th>アプリ</th></tr></thead>
      <tbody>
        <tr><td>1</td><td>昔の学校の写真と児童数を見て、問いを立てる。宿題は昔の人数（学校要覧でもよい）</td><td>使わない</td></tr>
        <tr><td>2</td><td>理由つきで予想の線をかく。全員の散らばりを見る</td><td>1・2、クラスで 見る</td></tr>
        <tr><td>3</td><td>データと比べ、「どうして違ったか」を書く。数字のあいまいさを扱う</td><td>3</td></tr>
        <tr><td>4</td><td>年齢の階段、もしも、クイズ。前提を変えると結果が変わることを確かめる</td><td>4</td></tr>
        <tr><td>5</td><td>まち歩き、または地域や市役所の方への聞き取り</td><td>使わない</td></tr>
        <tr><td>6</td><td>小さな学校のよさと課題を話し合い、提案の相手を決める</td><td>5 A</td></tr>
        <tr><td>7</td><td>提案を書き、読み合って直す</td><td>5</td></tr>
        <tr><td>8</td><td>校長先生や地域の方に届け、返事を受けてふりかえる</td><td>印刷の1枚</td></tr>
      </tbody>
    </table>
    </div>
  </section>

  <section class="card">
    <h2>配慮すること</h2>
    <ul>
      <li><b>使う前に、自分の学校と市内の学校の数字を見てください。</b>統合が決まった学校、小規模校、閉校した学校から来た子がいる学級では、練習用の「みらい市」で進め、自分のまちの話は市全体の数字にとどめる方法もあります。</li>
      <li>推計は「決まった未来」ではないことを、授業の中で必ず言葉にします。画面のステップ3にも「人数が へっても、学校が なくなると 決まった わけでは ないよ」と出ます。</li>
      <li>学校の統合や廃校を話題にするときは、賛否を決めさせません。小さい学校のよさと課題の両方を扱います。</li>
      <li>「同じ まちの 学校と くらべる」では、市内の学校名と増減の割合が並びます。順位の文は出しませんが、一覧は最初は閉じています。開くかどうかは学級の様子で決め、「どこがなくなるか」という話にしないでください。</li>
      <li>学校に「いまは この 名前では ないよ」の印が出たら、その数字は「もとの学校の区域に住む子どもの人数」として読みます。印は、国の学校コード一覧にその名前の学校が今は無いことだけを示し、閉校・統合・校名の変更を区別していません。「閉校した」と決めつけないでください。</li>
      <li>宿題（昔の人数を家の人に聞く）は、学校要覧や記念誌で代えられるようにします。転入した家庭や、家で聞けない子がいます。</li>
      <li>転校してきた子、少人数の学年の子が傷つく言い方にならないよう、数字と人を結びつけすぎないでください。</li>
      <li>全員の予想を映すときは、だれの予想かを当てさせません。理由は名前なしで、順番をまぜて出ます。理由の一覧は最初は閉じていて、先生が読んで確かめてから「理由を 見せる」で出せます。</li>
      <li>提案カードには本名を書かせません。</li>
    </ul>
  </section>

  <section class="card">
    <h2>データと計算の方法</h2>
    <ol>
      <li><b>将来推計人口</b>：国土数値情報「500mメッシュ別将来推計人口（令和6年国政局推計）」。令和2年国勢調査を基準に、2025年から2070年まで5年ごと、5歳階級別。</li>
      <li><b>学区</b>：国土数値情報「小学校区データ」（令和5年度）。公立小学校の通学区域のポリゴン。学区と学校の一覧は令和5年度のもので、その後の統合や新設は入っていません。このデータが無い市区町村（福岡市・北九州市など、自治体によって提供状況が異なる。一覧は COVERAGE.md）では、国土数値情報「学校」の位置を使います。学区のポリゴンに入らなかった地点だけを、その地点のメッシュの市区町村コードに並ぶ市区町村（境界をまたぐメッシュでは複数）のうち、学区データの無い市区町村の公立小学校の中でいちばん近い学校に割り当てた「おおよその区域」で計算し、画面にその旨を表示します。学区データがあっても、そこに入っていない公立小学校（福岡県では岡垣町の山田小・海老津小、宮若市の宮若西小、みやま市の瀬高小）は、学区に入らなかった地点を、その学校どうしの中でいちばん近い学校に割り当てて補い、同じく「おおよその区域」と表示します（学区のある学校の数字は変わりません）。</li>
      <li><b>集計</b>：メッシュ内の人口が一様に分布すると仮定し、学区と重なる面積の割合で各メッシュの人口を学区に配分。</li>
      <li><b>小学生の年齢</b>：6〜11歳人口 ＝（5〜9歳）× 4/5 ＋（10〜14歳）× 2/5。</li>
      <li><b>学級数</b>：国の標準（同学年35人、複式は2学年で16人以下、1年生を含む場合8人以下）で計算。自治体独自の少人数学級は反映していません。</li>
    </ol>
    <p>はじめの画面の「みらい市」は練習用の架空のまちで、数字は作りものです。</p>
  </section>

  <section class="card">
    <h2>読み取るときの注意</h2>
    <ul>
      <li>示しているのは「学区に住む6〜11歳の推計人口」です。私立・国立学校への通学、学校選択制、小規模特認校、区域外就学があるため、実際の在籍児童数とは一致しません。特に小規模特認校や学校選択制の学校は、学区の外からも児童が通うため、大きく違うことがあります。実際の人数が分かる場合は「1 ぎもん」で入力すると、その比で全体を補正します。</li>
      <li>小さな区域の推計は誤差が大きくなります。数人単位の違いに意味を持たせないでください。</li>
      <li>令和7年5月の実際の在籍児童数と比べると、市全体の合計は福岡市・北九州市・久留米市とも、推計が実際より少なめ（−0.4%〜−6.5%）でした。推計には私立・国立の小学校に通う子どもも入るので本来は多めに出るはずですが、その理由は切り分けていません。学校ごとの数字は、学区データのある久留米市ではずれの中央値が約13%（市全体の差を除くと約9%）なのに対し、「おおよその区域」で計算している福岡市・北九州市では約20〜24%で、30%を超えてずれる学校が3〜4割ありました。また、学区の代わりにいちばん近い学校で区域を作ると、それだけで学校ごとの推計が中央値で約15%変わることも分かっています（学区データのある福岡県内の市町村で、2通りの推計を比べた値。全国47都道府県で同じように比べると、県ごとに約9〜21%。実際の人数とのずれではありません。実際の人数との照合は福岡県の3市だけです）。学校の実際の人数が分かる場合は「1 ぎもん」で入力してください。くわしくは<a href="https://github.com/h-kazuki-pixel/watashi-no-gakkou-2050/blob/main/docs/ACCURACY.md" target="_blank" rel="noopener">推計の当たり具合（ACCURACY.md）</a>。</li>
      <li>学区は整備年度の区域です。その後の区域変更や統合は反映されていません。</li>
      <li>学区と学校の一覧は令和5年度のデータです。その後に閉校・統合した学校は、文部科学省の学校コード一覧（令和8年5月1日時点・暫定版）と照らし、確かに当たるものにだけ印を付けています。学区データに学校コードが無い学校は、学校コード一覧に同じ名前の学校が無いことを確かめて印を付けています。印の無い学校が、すでに閉校していることがあります。統合後の新しい学区は反映していないので、閉校した学校の数字は、もとの区域の人数のままです。統合でできた新しい学校は、名前だけを出し、人数は出していません。印は、文部科学省の学校コード一覧に、その名前の学校が今は無いことを示すもので、閉校したのか、統合や校名の変更なのかは区別していません。</li>
      <li>福島県の浜通り13市町村は、国の推計（国立社会保障・人口問題研究所）が13市町村を1つの地域として行われており、市町村別の推計値はありません。このアプリの数字は、国土数値情報のメッシュ別の値を学区ごとに集計したものです。富岡町・大熊町・双葉町・浪江町・葛尾村・飯舘村・楢葉町は、推計の土台になった2020年の国勢調査のとき町村内に住んでいた子どもが、いまの児童数より少なく、推計が実際とかけ離れるため、このアプリでは扱っていません。</li>
      <li>推計は、住宅開発や子育て施策などで変わります。「決まった未来」として扱わないことが、この教材の中心です。</li>
      <li>このアプリは学校の統廃合を予測・推奨するものではありません。小規模校の良さと課題の両方を、子どもが自分の言葉で考えるための材料です。</li>
    </ul>
  </section>

  <section class="card" id="class-howto">
    <h2>クラスで 使う（よそうを 集める）</h2>
    <p>ステップ2で線をかき終えると、子どもの画面に小さく「先生に よそうを わたす」が出ます。押すと、よそうを1つながりの文字（コード、「WG50-」で始まる）にしたものと「コピー」ボタンが出ます。</p>
    <ol>
      <li>子どもは、コードをコピーして、先生が決めた場所（Google Classroom の課題、Teams の投稿、学習支援ソフトの提出箱など、<b>学校で使っている道具</b>）に貼ります。</li>
      <li>先生は、集まった文をまとめてコピーし、<a href="#class" data-go="class">「クラスで 見る」</a>の欄に貼って「読みこむ」を押します。名前や日時がまじっていても、コードだけを読みます。同じコードは1回と数えます。</li>
      <li>全員の線（青の点線）と、2050年の予想の散らばり、「ふえる・同じ・へる」の数、理由の一覧（名前なし・順番はまぜる）を映します。理由の一覧は最初は閉じています。先生が読んで確かめてから「理由を 見せる」で出し、「理由を かくす」でまた隠せます。</li>
      <li>「データを 見せる」を押すまで、データの推計（赤い線と数）は出ません。押すと、データより多い・少ない・ほぼ同じ（画面の丸めで同じ）の人数が出ます。</li>
    </ol>
    <ul>
      <li>子どもがステップ1で学校の実際の人数（全校児童数）を入れていれば、コードに入ります。「クラスで 見る」では、読んだコードでいちばん多い値に推計を合わせ、「実際の 人数 ○人に 合わせて います」と出します。値は直せます（「合わせない」も選べます）。</li>
      <li>同じ子が線をかき直して2回送った場合は、端末ごとの印（初めてコードを作るときに作る、でたらめな6文字。名前や端末の情報からは作りません）で見分け、新しいほうだけを数えます。同じ端末を別の子が使うときは「さいしょから やりなおす」を押すと、印も新しくなります。</li>
      <li>貼り付けたときにコードの途中で改行されても、すぐ後ろの行（20行まで）をつないで読みます。</li>
      <li><b>提案も集まります。</b>ステップ5で提案を書く（アイデアを選ぶ）と「先生に 提案を わたす」が出ます。このコードには、よそうに加えて「いいこと？ しんぱいな こと？」の選択、選んだアイデア、自分のアイデア、宛先、提案の文が入ります（ニックネームと学年は入りません）。同じ子のステップ2のコードとは、新しいステップ5のコードが入れかわります。「クラスで 見る」の下の「みんなの 提案」に、カードごとの いいね・しんぱい・どちらとも の数、アイデアの順位、自分のアイデア、宛先ごとの提案が出ます。</li>
      <li><b>提案は、映す前に先生が読んで確かめてください。</b>提案の一覧は最初は閉じています（「ひらく」で出ます）。1件ずつ「印刷に 入れない」を選べます（画面を閉じると元に戻ります）。</li>
      <li><b>もっと知りたいデータも集まります。</b>ステップ5で子どもが選んだ「もっと 知りたい データ」を人数の多い順に表示し、多い3つを印刷の1枚に入れます。子どもが自分で書いた文は、先生の画面にだけ出ます。</li>
      <li><b>宛先ごとに印刷して届けられます（届ける前に、上の「授業のあと」を見てください）。</b>宛先を選び「印刷用の 1枚を 作る」を押すと、宛先・学校名・クラスの名前（その場で入れる。保存しません）・人数・データの要点・いいね／しんぱいの集計・アイデアの順位・提案の一覧・出典をA4縦1枚にまとめます。同じ文の提案は1行にまとめて人数を付けます。ふりがなは画面の「ふりがな」の切りかえに合わせます。</li>
    </ul>
    <ul>
      <li><b>コードに名前は入りません。</b>入るのは、都道府県・学校・「ふえる／同じ／へる」・線の値（2030〜2050年）・理由・実際の人数（入れた場合）・端末の印と番号、ステップ5のコードでは提案の中身だけです。理由に名前を書かないよう声をかけてください。</li>
      <li><b>読みこんだコードは保存しません。</b>この端末にも残らず、どこにも送りません。画面を閉じると消えます。</li>
      <li>コードの受け渡しは、学校で使っている道具で行ってください。このアプリは送受信の仕組みを持ちません。</li>
      <li>練習用の「みらい市」を選んでいるときは、「見本の クラスで ためす」で、架空の30人分のよそうと提案（24人分）を試せます。</li>
    </ul>
    <p><button type="button" class="btn primary" data-go="class">クラスで 見る →</button></p>
  </section>
